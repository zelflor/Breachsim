    <script>
        (() => {
            if (!window.AppSlides) {
                console.error('[Slides] AppSlides introuvable');
                return;
            }

            AppSlides.start();

            document.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    AppSlides.next();
                }

                if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    AppSlides.previous();
                }
            });
        })();
    </script>
